<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Avaliação Delivery | Bar do Adão</title><style>*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#8B0000,#C62828);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.container{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
  text-align:center;
}

.logo{
  font-size:60px;
  margin-bottom:10px;
}

h1{
  color:#8B0000;
  margin-bottom:5px;
}

.subtitulo{
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  text-align:left;
  margin:15px 0 8px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

textarea{
  height:100px;
  resize:none;
}

.estrelas{
  font-size:36px;
  color:#ccc;
  cursor:pointer;
  margin:10px 0;
}

.estrelas span{
  transition:.2s;
}

.estrelas span:hover{
  transform:scale(1.2);
}

.ativa{
  color:#FFD700;
}

button{
  margin-top:20px;
  width:100%;
  padding:15px;
  background:#25D366;
  border:none;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  border-radius:12px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#1EBE5D;
}</style></head><body>

  <div class="container">

    <div class="logo">🍻</div>

    <h1>Bar do Adão</h1>
    <p class="subtitulo">Como foi sua experiência com o Delivery?</p>

    <form id="avaliacaoForm">

      <label for="nome">Seu nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome">

      <label>Avalie nosso atendimento</label>

      <div class="estrelas">
        <span onclick="selecionar(1)">★</span>
        <span onclick="selecionar(2)">★</span>
        <span onclick="selecionar(3)">★</span>
        <span onclick="selecionar(4)">★</span>
        <span onclick="selecionar(5)">★</span>
      </div>

      <input type="hidden" id="nota" value="5">

      <label for="entrega">Entrega chegou no prazo?</label>
      <select id="entrega">
        <option>Sim</option>
        <option>Não</option>
      </select>

      
      <label for="qualidade">Qualidade da comida</label>
      <select id="qualidade">
        <option>Excelente</option>
        <option>Boa</option>
        <option>Regular</option>
        <option>Ruim</option>
      </select>

      <label for="comentario">Deixe um comentário</label>
      <textarea id="comentario" placeholder="Conte como foi sua experiência"></textarea>

      <button type="submit">Enviar Avaliação pelo WhatsApp</button>

    </form>

  </div>

  <script src="script.js"></script>

<script>
const estrelas=document.querySelectorAll('.estrelas span');
function selecionar(n){document.getElementById('nota').value=n;estrelas.forEach((e,i)=>e.classList.toggle('ativa',i<n));}
selecionar(5);
document.getElementById('avaliacaoForm').addEventListener('submit',function(e){
 e.preventDefault();
 const nome=document.getElementById('nome').value.trim()||'Cliente';
 const nota=document.getElementById('nota').value;
 const entrega=document.getElementById('entrega').value;
 const qualidade=document.getElementById('qualidade').value;
 const comentario=document.getElementById('comentario').value.trim()||'Sem comentário.';
 const msg=`🍻 *Avaliação Delivery - Bar do Adão*\n\n👤 Nome: ${nome}\n⭐ Nota: ${nota}/5\n🚚 Entrega no prazo: ${entrega}\n🍽️ Qualidade da comida: ${qualidade}\n\n💬 Comentário:\n${comentario}`;
 const url=`https://api.whatsapp.com/send?phone=5521995009807&text=${encodeURIComponent(msg)}`;
 window.location.assign(url);
});
</script></body></html>
